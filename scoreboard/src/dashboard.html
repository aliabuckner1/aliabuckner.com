<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site Stats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=DM+Mono&display=swap">
<style>
  :root {
    --bg: #eef3f5; --card: #ffffff; --fg: #0f2a33; --muted: #5d7780; --line: #d5e1e5; --grid: #e6eef1;
    --bar: #3d93a8; --bar-hover: #2b7a8e; --pink: #e8497a; --sun: #f2b705;
    --dev-phone: #1a8fb0; --dev-computer: #e8497a; --dev-tablet: #c98500; /* checked for colour-blind separation */
    --sans: "Avenir Next", "Instrument Sans", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1f26; --card: #13292f; --fg: #e6f1f2; --muted: #8fa9b0; --line: #24404a; --grid: #1c353d;
      --bar: #5cb8cc; --bar-hover: #86cddc;
      --dev-phone: #2a94b2; --dev-computer: #e2557f; --dev-tablet: #c08310;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--muted); }
  .mono, table { font-family: var(--mono); font-size: 12.5px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; padding: 5px 10px; background: var(--card); color: var(--fg); border: 0; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--card); }
  label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
  .named { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .tile .v { font-size: 26px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
  .grid3 .card { margin-bottom: 0; }
  /* devices: one bar split by share, with a 2px gap between segments */
  .split { display: flex; gap: 2px; height: 16px; margin: 4px 0 12px; }
  .split i { display: block; height: 100%; min-width: 3px; }
  .split i:first-child { border-radius: 4px 0 0 4px; }
  .split i:last-child { border-radius: 0 4px 4px 0; }
  .split i:only-child { border-radius: 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: baseline; }
  @media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; margin-bottom: 14px; }
  .grid2 .card { margin-bottom: 0; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; vertical-align: top; }
  th { color: var(--muted); font-weight: 400; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--grid); }
  .who { font-weight: 600; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 99px; background: var(--grid); color: var(--fg); margin: 1px 2px 1px 0; }
  .tag.link { background: var(--pink); color: #fff; }
  .empty { color: var(--muted); padding: 8px 0; }
  /* the grouped "what people did" table */
  tr.group td { padding-top: 16px; border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 14px; font-weight: 600; }
  tr.group td .sub { font-weight: 400; font-size: 13px; }
  tr.item td:first-child { padding-left: 26px; }
  .mini { display: inline-block; width: 64px; height: 8px; margin-right: 8px; background: var(--grid); border-radius: 3px; vertical-align: middle; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--bar); border-radius: 0 3px 3px 0; }
  td.muted { color: var(--muted); }
  /* within-a-mode bars: lighter, outlined, so they don't read as the same scale as "of everyone" */
  .mini.within { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
  .mini.within i { background: color-mix(in srgb, var(--bar) 40%, transparent); }
  /* chart */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 180px; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font: 11px var(--mono); }
  .chart rect.bar { fill: var(--bar); }
  .chart rect.bar.on { fill: var(--bar-hover); }
  .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--card); font: 12px var(--mono); padding: 5px 8px; border-radius: 5px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }
  .tip[hidden] { display: none; }
  /* funnel */
  .funnel { display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .track { height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .step .pct { font: 12.5px var(--mono); color: var(--muted); min-width: 7.5em; text-align: right; }
  /* drill-down panel */
  .panel { position: fixed; inset: 0 0 0 auto; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.15); overflow-y: auto; padding: 16px; z-index: 5; }
  .panel[hidden] { display: none; }
  .panel .close { float: right; font: inherit; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .visit { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .visit .meta { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; font: 12.5px var(--mono); }
  .timeline li { display: grid; grid-template-columns: 4.2em 1fr; gap: 8px; padding: 2px 0; }
  .timeline .t { color: var(--muted); text-align: right; }
  .counts { margin-top: 8px; color: var(--muted); font: 12px var(--mono); }
  .rename { display: flex; gap: 6px; align-items: center; margin: 10px 0 2px; font-size: 13px; color: var(--muted); }
  .rename input { font: inherit; font-size: 16px; width: 12em; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .rename button { font: inherit; font-size: 13px; color: var(--card); background: var(--fg); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .msg { padding: 40px 0; text-align: center; color: var(--muted); }
  /* the password box */
  .login { max-width: 320px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px; text-align: center; }
  .login h1 { margin-bottom: 4px; }
  .login form { display: flex; gap: 8px; margin-top: 14px; }
  .login input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .login button, .logout { font: inherit; color: var(--card); background: var(--fg); border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .logout { background: none; color: var(--muted); padding: 0; font-size: 13px; text-decoration: underline; }
  .login .err { color: var(--pink); min-height: 1.4em; margin: 10px 0 0; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>aliabuckner.com</h1><div class="sub">who came by, and what they did · <button class="logout" id="logout">log out</button></div></div>
    <div class="controls">
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-days="1">today</button><button data-days="7">7 days</button><button data-days="30" aria-pressed="true">30 days</button><button data-days="0">all</button>
      </div>
      <label class="check"><input type="checkbox" id="labelled" checked autocomplete="off"> include my devices</label>
    </div>
  </header>
  <p class="named" id="named"></p>
  <div id="body"><p class="msg">loading…</p></div>
</main>
<aside class="panel" id="panel" hidden aria-label="Person details"></aside>
<script>
(() => {
  // the key arrives in the link's #hash (so it's never sent to a server or stored in logs), then is remembered here
  const API = location.hostname.endsWith("workers.dev") ? "" : "https://aliabuckner-scoreboard.aliabuckner-scoreboard.workers.dev";
  let key = location.hash.slice(1);
  try { if (key) { localStorage.setItem("stats-key", key); history.replaceState(null, "", location.pathname); } else key = localStorage.getItem("stats-key") || ""; } catch (e) {}
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const opts = { days: 30, labelled: true }; // your own devices are included by default for now
  let data = null;

  // what each event means, in words; null = not shown on its own in timelines
  const NAMES = {
    visit: "arrived", knock: "knocked the name over", pop: "popped a letter", typed: "typed letters",
    secret: "typed a secret word", gravity: "changed gravity", chute: "sent a letter through the roof (parachute)",
    dj: "started DJ mode", drum: "added a drum", note: "played a note", dance: "made a letter dance", drop: "dropped the beat",
    hoop_shown: "the hoop appeared", hoop_play: "played basketball", hoop_score: "basketball round", words_start: "started the word game",
    words_score: "word game round", board_add: "added their name to the scoreboard", link: "clicked a link",
    reset: "pressed reset", sound: "sound button", stop_game: "left a game", all_big: "made every letter as big as it goes",
    ring: "got everyone dancing in a ring", ask: "was offered a game (words? / basketball? tab)", tally: null,
  };
  // the "what people did" groups, in a fixed order; start = the row the rest of the group is measured against
  const GROUPS = [
    { icon: "🔗", name: "links", items: [
      { key: "link:resume", name: "clicked resume" }, { key: "link:email", name: "clicked email" }, { key: "link:linkedin", name: "clicked linkedin" }] },
    { icon: "👆", name: "playing around", start: "knock", items: [
      { key: "knock", name: "knocked the name over", tally: "knocks" }, { key: "t:throws", name: "threw letters", tally: "throws" },
      { key: "gravity", name: "changed gravity", tally: "gravity" }, { key: "pop", name: "popped a letter", tally: "pops" },
      { key: "chute", name: "sent a letter through the roof", tally: "chutes" }, { key: "typed", name: "typed letters", tally: "keys" },
      { key: "secret", name: "typed a secret word" }, { key: "all_big", name: "made every letter as big as it goes" },
      { key: "reset", name: "pressed reset" }] },
    { icon: "🎵", name: "DJ mode", start: "dj", items: [
      { key: "dj", name: "started DJ mode" }, { key: "drum", name: "added drums", tally: "drums" }, { key: "note", name: "played notes", tally: "notes" },
      { key: "dance", name: "made letters dance", tally: "dances" }, { key: "drop", name: "dropped the beat" },
      { key: "ring", name: "danced in a ring round the last letter" }] },
    { icon: "🏀", name: "basketball", start: "hoop_shown", items: [
      { key: "hoop_shown", name: "the hoop appeared" }, { key: "hoop_play", name: "played a round" },
      { key: "t:baskets", name: "scored baskets", tally: "baskets" }, { key: "board_add:hoop", name: "added their name to the board" }] },
    { icon: "🔤", name: "word game", start: "words_start", items: [
      { key: "words_start", name: "started the word game" }, { key: "words_score", name: "finished a round" },
      { key: "t:words", name: "scored words", tally: "words" }, { key: "board_add:words", name: "added their name to the board" }] },
  ];
  const TALLY = [["throws", "throws"], ["touches", "taps & drags"], ["thumps", "thumps"], ["knocks", "knock-overs"], ["pops", "letters popped"],
    ["keys", "keys typed"], ["drums", "drums added"], ["notes", "notes played"], ["dances", "dances"], ["chutes", "parachutes"],
    ["baskets", "baskets"], ["words", "words scored"], ["gravity", "gravity changes"]];

  const ago = (ts) => { const s = (Date.now() - ts) / 1000; return s < 90 ? "just now" : s < 5400 ? Math.round(s / 60) + "m ago" : s < 129600 ? Math.round(s / 3600) + "h ago" : Math.round(s / 86400) + "d ago"; };
  const dur = (s) => { s = Math.round(s || 0); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s"; };
  const when = (ts) => new Date(ts).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const median = (xs) => { if (!xs.length) return 0; const a = [...xs].sort((x, y) => x - y), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + "%" : "–");
  const parse = (d) => { try { return d ? JSON.parse(d) : {}; } catch (e) { return {}; } };
  const say = (r) => {
    const d = r.d;
    if (r.event === "link") return "clicked " + (d.which || "a link") + (d.how === "typed" ? " (typed it)" : "");
    if (r.event === "hoop_score") return "basketball round: " + (d.score ?? 0) + " points";
    if (r.event === "words_score") return "word game round: " + (d.score ?? 0) + " points, " + (d.words ?? 0) + " words";
    if (r.event === "words_start") return "started the word game" + (d.how ? " (" + ({ spelled: "spelled a word on the floor", typed: "typed “word”", tab: "the words? tab" }[d.how] || d.how) + ")" : "");
    if (r.event === "board_add") return "added their name to the " + (d.game === "words" ? "word game" : "basketball") + " board (" + d.score + ")";
    if (r.event === "secret") return "typed a secret word" + (d.word ? " (" + d.word + ")" : "");
    if (r.event === "gravity") return "changed gravity" + (d.mode != null ? " (" + ["normal", "upside down", "off"][d.mode] + ")" : "");
    if (r.event === "sound") return "turned sound " + (d.on ? "on" : "off");
    if (r.event === "visit") return "arrived" + (d.ref ? " from " + d.ref : d.src ? " via " + d.src : "");
    return NAMES[r.event] || r.event;
  };

  // automated visits (link checkers, crawlers): driven by automation software, or from a hosting / security company's
  // network without ever touching anything. People on those networks who actually play still count.
  const HOSTING = /\b(ovh|logicweb|palo alto networks|reflectionai|digitalocean|hetzner|linode|akamai|amazon|aws|google cloud|microsoft azure|azure|oracle|cloudflare|contabo|vultr|choopa|m247|datacamp|zscaler|leaseweb|scaleway|tencent|alibaba|hostinger|ionos|godaddy|censys|shadowserver|hurricane electric|colocrossing|psychz)\b/i;
  const INTERACTIONS = new Set(["visit", "tally"]);
  const isBot = (p) => p.visits.some((v) => v.events.some((e) => e.event === "visit" && e.d.bot)) ||
    (HOSTING.test(p.network || "") && p.visits.every((v) => v.events.every((e) => INTERACTIONS.has(e.event)) && !v.active && !(v.tally.touches || v.tally.keys)));

  // ---- shape the raw events into people and visits
  function build(rows) {
    const visits = new Map();
    for (const r of rows) {
      r.d = parse(r.data);
      let v = visits.get(r.visit);
      if (!v) {
        v = { id: r.visit, visitor: r.visitor, label: r.label, device: r.device, country: r.country, city: r.city, network: r.network, start: r.ts, end: r.ts, events: [], tally: {}, ref: "" };
        visits.set(r.visit, v);
      }
      v.end = Math.max(v.end, r.ts);
      if (r.event === "visit") { v.start = Math.min(v.start, r.ts); v.ref = r.d.ref || (r.d.src ? "via " + r.d.src : ""); }
      if (r.event === "tally") { for (const [k, n] of Object.entries(r.d)) v.tally[k] = Math.max(v.tally[k] || 0, n); }
      else v.events.push(r);
    }
    for (const v of visits.values()) {
      v.secs = Math.max(v.tally.secs || 0, (v.end - v.start) / 1000);
      v.active = v.tally.active || 0;
      v.did = new Set(v.events.map((e) => e.event));
      v.keys = new Set([...v.did,
        ...v.events.filter((e) => e.event === "link").map((e) => "link:" + e.d.which),
        ...v.events.filter((e) => e.event === "board_add").map((e) => "board_add:" + e.d.game),
        ...Object.keys(v.tally).filter((k) => k !== "secs" && k !== "active" && v.tally[k] > 0).map((k) => "t:" + k)]);
      v.links = v.events.filter((e) => e.event === "link").map((e) => e.d.which);
    }
    const people = new Map();
    for (const v of [...visits.values()].sort((a, b) => a.start - b.start)) {
      let p = people.get(v.visitor);
      if (!p) { p = { id: v.visitor, label: v.label, visits: [], first: v.start }; people.set(v.visitor, p); }
      p.visits.push(v); p.last = v.start; p.label = p.label || v.label;
    }
    for (const p of people.values()) {
      p.secs = p.visits.reduce((a, v) => a + v.secs, 0);
      p.active = p.visits.reduce((a, v) => a + v.active, 0);
      p.throws = p.visits.reduce((a, v) => a + (v.tally.throws || 0), 0);
      p.links = p.visits.flatMap((v) => v.links);
      p.did = new Set(p.visits.flatMap((v) => [...v.did]));
      p.keys = new Set(p.visits.flatMap((v) => [...v.keys]));
      const last = p.visits[p.visits.length - 1];
      p.place = [last.city, last.country].filter(Boolean).join(", ");
      p.network = last.network; p.device = last.device;
      p.ref = (p.visits.find((v) => v.ref) || {}).ref || "";
    }
    // leave the automated visits out of everything, but say how many there were
    const all = [...people.values()], bots = all.filter(isBot), botIds = new Set(bots.map((p) => p.id));
    return { visits: [...visits.values()].filter((v) => !botIds.has(v.visitor)), people: all.filter((p) => !botIds.has(p.id)), bots };
  }
  // what to call someone: a name Alia gave them, else their device label, else the end of their random id
  const nameOf = (id, label) => (data.names && data.names[id]) || label || "#" + id.slice(-5);
  const short = (p) => nameOf(p.id, p.label);
  const played = (did) => did.has("hoop_play") || did.has("words_start") || did.has("dj");

  // ---- the page
  function render() {
    const { visits, people, bots } = build(data.rows);
    const n = people.length;
    $("named").textContent = data.named.length
      ? "your named devices: " + data.named.map((x) => `${x.label} (${x.visits} visit${x.visits === 1 ? "" : "s"}, last ${ago(x.last)})`).join(" · ") + (opts.labelled ? "" : " — not counted below")
      : "no named devices yet — open the site once with ?me=alia (or ?me=dad) on each device";
    if (bots.length) $("named").textContent += ` · ${bots.length} automated visit${bots.length === 1 ? "" : "s"} hidden (link checkers and crawlers)`;
    if (!visits.length) { $("body").innerHTML = `<p class="msg">nobody yet in this range</p>`; return; }

    const linkPeople = people.filter((p) => p.links.length).length;
    const tiles = [
      [n, "people"], [visits.length, "visits"],
      [dur(median(visits.map((v) => v.secs))), "typical time on the site"],
      [dur(median(visits.map((v) => v.active))), "typical active time"],
      [pct(people.filter((p) => p.did.has("knock")).length, n), "knocked the name over"],
      [linkPeople, "clicked resume, email or linkedin"],
    ];

    // people per day
    const dayKey = (ts) => { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const span = data.days || Math.max(1, Math.ceil((Date.now() - Math.min(...visits.map((v) => v.start))) / 86400000) + 1);
    const daysList = [];
    for (let i = span - 1; i >= 0; i--) daysList.push(dayKey(Date.now() - i * 86400000));
    const perDay = new Map(daysList.map((d) => [d, { people: new Set(), visits: 0 }]));
    for (const v of visits) { const b = perDay.get(dayKey(v.start)); if (b) { b.people.add(v.visitor); b.visits++; } }

    // the funnel: of the people who came, how far did they get
    const funnel = [
      ["arrived", n],
      ["knocked the name over", people.filter((p) => p.did.has("knock")).length],
      ["played a game or DJ mode", people.filter((p) => played(p.did)).length],
      ["clicked resume, email or linkedin", linkPeople],
    ];

    // what people did, grouped by part of the site; each mode reads top to bottom in the order you'd do it.
    // "of those who started" = share of the people who reached that mode's first row
    const reached = (key) => people.filter((p) => p.keys.has(key)).length;
    const total = (it) => it.tally
      ? visits.reduce((a, v) => a + (v.tally[it.tally] || 0), 0)
      : visits.reduce((a, v) => a + v.events.filter((e) => (e.event === it.key.split(":")[0]) && (!it.key.includes(":") || it.key.split(":")[1] === (e.d.which || e.d.game))).length, 0);
    const groups = GROUPS.map((g) => {
      const items = g.items.map((it) => ({ ...it, people: reached(it.key), total: total(it) }));
      const starters = g.start ? reached(g.start) : people.filter((p) => g.items.some((it) => p.keys.has(it.key))).length;
      return { ...g, items, starters };
    });

    const clicks = visits.flatMap((v) => v.events.filter((e) => e.event === "link").map((e) => ({ e, v }))).sort((a, b) => b.e.ts - a.e.ts);
    const count = (xs) => { const m = new Map(); for (const x of xs) m.set(x, (m.get(x) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]); };
    const sources = count(people.map((p) => p.ref || "direct / unknown"));
    // devices in a fixed order, so each always keeps its colour
    const DEV = ["phone", "computer", "tablet"];
    const devices = DEV.map((d) => [d, people.filter((p) => p.device === d).length]).filter(([, v]) => v);
    const places = count(people.map((p) => p.place || "unknown")).slice(0, 10);

    $("body").innerHTML = `
      <div class="tiles">${tiles.map(([v, k]) => `<div class="tile"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("")}</div>
      <div class="card"><h2>people per day</h2><div class="chart" id="chart"></div></div>
      <div class="grid2">
        <div class="card"><h2>how far people got</h2><div class="funnel">${funnel.map(([k, v]) => `
          <div class="step"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${n ? (100 * v) / n : 0}%"></div></div><span class="pct">${v} · ${pct(v, n)}</span></div>`).join("")}</div></div>
        <div class="card"><h2>link clicks</h2>${clicks.length ? `<div class="scroll"><table><tr><th>when</th><th>link</th><th>who</th><th>from</th></tr>${clicks.slice(0, 12).map(({ e, v }) => `
          <tr class="click" data-person="${esc(v.visitor)}"><td>${esc(ago(e.ts))}</td><td>${esc(e.d.which)}</td><td>${esc(nameOf(v.visitor, v.label))}</td><td>${esc([v.city, v.country].filter(Boolean).join(", "))}${v.network ? " · " + esc(v.network) : ""}</td></tr>`).join("")}</table></div>` : `<p class="empty">no clicks yet</p>`}</div>
      </div>
      <div class="grid2">
      </div>
      <div class="card"><h2>what people did</h2><div class="scroll"><table>
        <tr><th></th><th class="n">people</th><th>of everyone</th><th title="share of the people who did the first thing in that group">of those who got that far</th><th class="n">total</th></tr>
        ${groups.map((g) => `
          <tr class="group"><td colspan="5">${g.icon} ${esc(g.name)} <span class="sub">— ${g.starters} ${g.starters === 1 ? "person" : "people"}, ${pct(g.starters, n)}${g.start ? "" : " (open from the start, so there's no first step)"}</span></td></tr>
          ${g.items.map((it) => `
          <tr class="item"><td>${esc(it.name)}</td><td class="n">${it.people}</td>
            <td><span class="mini"><i style="width:${n ? (100 * it.people) / n : 0}%"></i></span>${pct(it.people, n)}</td>
            <td class="${g.start && it.key !== g.start ? "" : "muted"}">${g.start && it.key !== g.start
              ? `<span class="mini within"><i style="width:${g.starters ? (100 * it.people) / g.starters : 0}%"></i></span>${pct(it.people, g.starters)}` : "–"}</td>
            <td class="n">${it.total}</td></tr>`).join("")}`).join("")}
      </table></div></div>
      <div class="card"><h2>people <span class="sub">— click one to see their visits</span></h2><div class="scroll"><table>
        <tr><th>who</th><th class="n">visits</th><th>last seen</th><th class="n">time</th><th class="n">active</th><th class="n">throws</th><th>did</th><th>from</th><th>where</th></tr>
        ${[...people].sort((a, b) => b.last - a.last).map((p) => `
        <tr class="click" data-person="${esc(p.id)}"><td class="who">${esc(short(p))}</td><td class="n">${p.visits.length}</td><td>${esc(ago(p.last))}</td>
          <td class="n">${dur(p.secs)}</td><td class="n">${dur(p.active)}</td><td class="n">${p.throws}</td>
          <td>${p.links.map((l) => `<span class="tag link">${esc(l)}</span>`).join("")}${["dj", "hoop_play", "words_start"].filter((k) => p.did.has(k)).map((k) => `<span class="tag">${{ dj: "dj", hoop_play: "hoop", words_start: "words" }[k]}</span>`).join("")}</td>
          <td>${esc(p.ref || "")}</td><td>${esc([p.place, p.device].filter(Boolean).join(" · "))}</td></tr>`).join("")}
      </table></div></div>
      <div class="grid3">
        ${[["where people came from", sources], ["devices", devices], ["places", places]].map(([title, list]) => `
        <div class="card"><h2>${title}</h2>
          ${title === "devices" ? `<div class="split" role="img" aria-label="${esc(devices.map(([k, v]) => k + " " + pct(v, n)).join(", "))}">${devices.map(([k, v]) => `<i title="${esc(k)}: ${v} (${pct(v, n)})" style="flex:${v};background:var(--dev-${k})"></i>`).join("")}</div>` : ""}
          <table><tr><th></th><th class="n">people</th><th class="n">share</th></tr>${list.map(([k, v]) => `
          <tr><td>${title === "devices" ? `<span class="sw" style="background:var(--dev-${k})"></span>` : ""}${esc(k)}</td><td class="n">${v}</td><td class="n">${pct(v, n)}</td></tr>`).join("")}</table></div>`).join("")}
      </div>`;

    drawChart($("chart"), daysList.map((d) => ({ d, v: perDay.get(d).people.size, visits: perDay.get(d).visits })));
    for (const tr of document.querySelectorAll("[data-person]")) tr.addEventListener("click", () => openPerson(people.find((p) => p.id === tr.dataset.person)));
  }

  // one bar per day; hover (or tap) a day for its numbers
  function drawChart(el, pts) {
    const Wd = 900, Ht = 180, padL = 28, padB = 22, padT = 8, max = Math.max(1, ...pts.map((p) => p.v));
    const step = Math.max(1, Math.ceil(max / 4)), top = Math.ceil(max / step) * step;
    const bw = (Wd - padL) / pts.length, y = (v) => padT + (Ht - padT - padB) * (1 - v / top);
    let svg = `<svg viewBox="0 0 ${Wd} ${Ht}" preserveAspectRatio="none" role="img" aria-label="people per day">`;
    for (let t = 0; t <= top; t += step) svg += `<line class="gridline" x1="${padL}" x2="${Wd}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
    pts.forEach((p, i) => {
      const x = padL + i * bw + Math.min(2, bw * 0.15), w = Math.max(1, bw - Math.min(4, bw * 0.3)), h = Math.max(0, y(0) - y(p.v));
      if (p.v) svg += `<path class="bar" d="M${x},${y(0)} v${-(h - Math.min(4, h))} q0,${-Math.min(4, h)} ${Math.min(4, w / 2)},${-Math.min(4, h)} h${w - 2 * Math.min(4, w / 2)} q${Math.min(4, w / 2)},0 ${Math.min(4, w / 2)},${Math.min(4, h)} v${h - Math.min(4, h)} z" style="fill:var(--bar)" data-i="${i}"/>`;
      svg += `<rect x="${padL + i * bw}" y="${padT}" width="${bw}" height="${Ht - padT - padB}" fill="transparent" data-i="${i}"/>`;
      if (pts.length <= 8 || i % Math.ceil(pts.length / 6) === 0 || i === pts.length - 1) svg += `<text class="axis" x="${padL + i * bw + bw / 2}" y="${Ht - 6}" text-anchor="middle">${p.d.slice(5).replace("-", "/")}</text>`;
    });
    el.innerHTML = svg + `</svg><div class="tip" hidden></div>`;
    const tip = el.querySelector(".tip"), svgEl = el.querySelector("svg");
    const show = (i) => {
      const p = pts[i], r = svgEl.getBoundingClientRect(), sx = r.width / Wd;
      tip.hidden = false; tip.textContent = `${p.d}: ${p.v} ${p.v === 1 ? "person" : "people"}, ${p.visits} visit${p.visits === 1 ? "" : "s"}`;
      tip.style.left = (padL + i * bw + bw / 2) * sx + "px"; tip.style.top = y(p.v) * (r.height / Ht) + "px";
      el.querySelectorAll("path.bar").forEach((b) => b.style.fill = b.dataset.i == i ? "var(--bar-hover)" : "var(--bar)");
    };
    el.addEventListener("pointermove", (e) => { const i = e.target.dataset && e.target.dataset.i; if (i != null) show(+i); });
    el.addEventListener("pointerleave", () => { tip.hidden = true; el.querySelectorAll("path.bar").forEach((b) => b.style.fill = "var(--bar)"); });
  }

  // a person's visits, newest first, each with its timeline
  function openPerson(p) {
    if (!p) return;
    const panel = $("panel");
    panel.innerHTML = `<button class="close" id="close">close</button>
      <h1>${esc(short(p))}</h1>
      <form class="rename" id="rename"><span>name</span><input id="renameInput" maxlength="24" placeholder="who is this?" value="${esc((data.names && data.names[p.id]) || "")}"><button type="submit">save</button><span id="renameMsg"></span></form>
      <div class="sub">${p.visits.length} visit${p.visits.length === 1 ? "" : "s"} · first ${esc(when(p.first))} · ${esc([p.place, p.device].filter(Boolean).join(" · "))}${p.network ? " · " + esc(p.network) : ""}</div>
      ${[...p.visits].reverse().map((v) => {
        const counts = TALLY.filter(([k]) => v.tally[k]).map(([k, name]) => `${v.tally[k]} ${name}`).join(" · ");
        return `<div class="visit"><div class="who">${esc(when(v.start))}</div>
          <div class="meta">${dur(v.secs)} on the site, ${dur(v.active)} active · ${esc(v.ref || "direct / unknown")} · ${esc(v.device || "")}</div>
          <ol class="timeline">${v.events.map((e) => `<li><span class="t">+${dur((e.ts - v.start) / 1000)}</span><span>${esc(say(e))}</span></li>`).join("")}</ol>
          ${counts ? `<div class="counts">${esc(counts)}</div>` : ""}</div>`;
      }).join("")}`;
    panel.hidden = false;
    $("close").addEventListener("click", () => { panel.hidden = true; });
    // naming someone: saved on the server, then the page redraws with the new name
    $("rename").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("renameInput").value.trim();
      $("renameMsg").textContent = "saving…";
      try {
        const res = await fetch(API + "/names", { method: "POST", headers: { "x-key": key, "content-type": "application/json" }, body: JSON.stringify({ visitor: p.id, name }) });
        if (!res.ok) throw new Error();
        data.names = data.names || {};
        if (name) data.names[p.id] = name; else delete data.names[p.id];
        render();
        openPerson(build(data.rows).people.find((x) => x.id === p.id));
      } catch (er) { $("renameMsg").textContent = "couldn't save"; }
    });
  }
  addEventListener("keydown", (e) => { if (e.key === "Escape") $("panel").hidden = true; });

  // no password remembered yet (or a wrong one): a password box instead of the dashboard
  const forget = () => { key = ""; try { localStorage.removeItem("stats-key"); } catch (e) {} };
  function showLogin(err) {
    document.querySelector("main").hidden = true;
    let box = $("login");
    if (!box) {
      box = document.createElement("div"); box.id = "login"; box.className = "login";
      box.innerHTML = `<h1>stats</h1><div class="sub">private: password, please</div>
        <form id="loginForm"><input id="pw" type="password" autocomplete="current-password" aria-label="password" placeholder="password"><button type="submit">open</button></form>
        <p class="err" id="err"></p>`;
      document.body.prepend(box);
      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const pw = $("pw").value; if (!pw) return;
        key = pw; try { localStorage.setItem("stats-key", pw); } catch (er) {}
        $("err").textContent = "checking…"; load();
      });
    }
    box.hidden = false; $("err").textContent = err; $("pw").value = ""; $("pw").focus();
  }
  let loading = 0;
  async function load() {
    if (!key) { showLogin(""); return; }
    const q = `?days=${opts.days}&labelled=${opts.labelled ? 1 : 0}`, mine = ++loading;
    try {
      const res = await fetch(API + "/stats" + q, { headers: { "x-key": key } });
      if (mine !== loading) return; // a newer request (from another click) is on its way
      if (res.status === 401) { forget(); showLogin("that password isn't right"); return; }
      if (!res.ok) { $("body").innerHTML = `<p class="msg">couldn't load the stats</p>`; return; }
      const json = await res.json();
      if (mine !== loading) return;
      data = json;
      if ($("login")) $("login").hidden = true;
      document.querySelector("main").hidden = false;
      render();
    } catch (e) { $("body").innerHTML = `<p class="msg">couldn't load the stats</p>`; }
  }
  for (const b of document.querySelectorAll("#range button")) b.addEventListener("click", () => {
    opts.days = +b.dataset.days; document.querySelectorAll("#range button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); load();
  });
  $("labelled").addEventListener("change", (e) => { opts.labelled = e.target.checked; load(); });
  $("logout").addEventListener("click", () => { forget(); showLogin(""); });
  load();
})();
</script>
</body>
</html>
