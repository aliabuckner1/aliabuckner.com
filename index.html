<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=DM+Mono&display=swap">
<style>
  /* layout: one full-height stage that is the toy, with a slim switcher rail underneath */
  :root {
    --bg: #e9f1f4; --fg: #0f2a33; --muted: #557078; --line: #c5d5da;
    --pink: #e8497a; --sun: #f2b705; --sea: #4fa9bd; --foam: #ffffff;
    --display: "Avenir Next", "Instrument Sans", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1f26; --fg: #e6f1f2; --muted: #8fa9b0; --line: #24404a;
      --pink: #ff6f9c; --sun: #ffd04a; --sea: #2c7f93; --foam: #eaf7fa; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1f26; --fg: #e6f1f2; --muted: #8fa9b0; --line: #24404a;
    --pink: #ff6f9c; --sun: #ffd04a; --sea: #2c7f93; --foam: #eaf7fa; color-scheme: dark;
  }
  html, body { height: 100%; }
  html { color-scheme: light; }
  @media (prefers-color-scheme: dark) { html { color-scheme: dark; } }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  body { margin: 0; -webkit-text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; overflow: hidden;
    font-family: var(--mono); font-size: 13px;
  }
  #stage { flex: 1; min-height: 0; position: relative; }
  #cv {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .rail {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 24px;
    padding-block: 10px; padding-inline: 16px;
    border-top: 1px solid var(--line);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .sound {
    order: 2; margin-left: auto; font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 4px;
  }
  .sound:hover { color: var(--fg); }
  #resetBtn:not([hidden]) + .sound { margin-left: 0; } /* reset sits just left of sound */
  .sound:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .tabs button {
    font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer;
    padding: 6px 10px; border-bottom: 2px solid transparent;
  }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--pink); }
  .tabs button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  /* the hint never changes the bar's height, so new hint text can't resize (and reset) the toy */
  #hint {
    order: 1; flex: 1 1 14rem; min-width: 0; margin: 0; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 700px) {
    #hint { order: 3; flex-basis: 100%; white-space: normal; height: 2.8em; line-height: 1.4; }
  }
  .hoop-card {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 200px; max-width: calc(100% - 32px); padding-block: 20px; padding-inline: 28px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25); text-align: center;
  }
  .hoop-card[hidden] { display: none; }
  .hoop-score { margin: 0; font-family: var(--display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
  .hoop-sub, .hoop-best { margin: 0; color: var(--muted); }
  .hoop-best.is-new { color: var(--pink); }
  .hoop-actions { display: flex; gap: 8px; margin-top: 12px; }
  .hoop-actions button {
    font: inherit; color: var(--fg); background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px;
  }
  .hoop-actions button.primary { background: var(--pink); border-color: var(--pink); color: var(--bg); }
  .hoop-actions button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
</style>

<body>
<div id="stage">
  <canvas id="cv" aria-label="Interactive bio toy"></canvas>
  <section class="hoop-card" id="hoopCard" role="dialog" aria-labelledby="hoopScore" hidden>
    <p class="hoop-score" id="hoopScore">0</p>
    <p class="hoop-sub" id="hoopSub">points in 20 seconds</p>
    <p class="hoop-best" id="hoopBest"></p>
    <div class="hoop-actions">
      <button type="button" class="primary" id="hoopAgain">play again</button>
      <button type="button" id="hoopDone">done</button>
    </div>
  </section>
</div>
<nav class="rail" aria-label="Prototypes">
  <p id="hint"></p>
  <button type="button" class="sound" id="resetBtn" hidden>reset</button>
  <button type="button" class="sound" id="soundBtn" aria-pressed="false">sound on</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  // ---- the only things to edit -------------------------------------------
  // each poke-and-reassemble swaps the message for the next one
  const PILE_STAGES = ["alia buckner"]; // the letters you play with
  const DANCER_AT = 2; // the name's "i" is drawn as a little dancing figure
  const STICK_MAX_SPEED = 18; // a throw never sends him faster than this (px per physics step)
  const STICK_FLOAT = 0.5; // going up after a throw he feels this much less gravity, so he still floats up high, gently
  // on the live site he's only a little person while the name is standing (and on his way down) and turns into a
  // plain "i" when he lands; with this off he stays a person the whole time
  const DANCER_TURNS_INTO_I = true;
  const isStick = (b) => !!b && b.dancerI && !b.asLetter;
  const LINKS_LINE = "resume   email   linkedin"; // shown under the name; floats away while you play
  const NAME_Y = 0.27; // where the name sits, as a fraction of the screen height
  // knocking the name over plays in slow motion: this speed for SLOW_HOLD seconds, then easing back to normal over SLOW_RAMP
  const SLOW_SCALE = 0.3, SLOW_HOLD = 2.2, SLOW_RAMP = 1.5;
  // letters falling back to the floor when DJ mode starts, and after the drop's upside-down bars
  const FALL_SLOWMO = { scale: 0.45, hold: 1.2, ramp: 1.2 };
  const PILE_LINKS = ["resume", "email", "linkedin"]; // the words of the last stage, each a link
  // where each link goes. Fill these in: a resume URL, "mailto:you@example.com", a LinkedIn profile URL
  const PILE_URLS = { resume: "resume.pdf", email: "mailto:aliabuckner@gmail.com", linkedin: "https://www.linkedin.com/in/aliabuckner/" };
  const PILE_SELF_FIX = 15; // seconds of no touching before the pile reassembles itself
  const PILE_FIRST_FIX = 5; // ...but when a new message is waiting to be revealed (the links), it only waits this long
  const POP_TAPS = 9; // taps on one letter before it pops
  const POP_MAX_SIZE = 8; // how many times its size it has swollen to on the tap before it pops
  // type one of these words and its emoji floats down a beat after the last letter
  const WORD_EMOJI = {
    hi: "\u{1F44B}", hey: "\u{1F44B}", hello: "\u{1F44B}",
    alia: "\u{1F451}",
  };
  const GRAVITY_MODES = ["gravity: normal", "gravity: upside down", "gravity: off"]; // press and hold cycles through these
  const PARACHUTE_DRAG = 0.18; // higher is a slower, floatier parachute descent
  const HOOP_FIRST_THROWS = [8, 13]; // the hoop first rises after a random number of throws in this range
  const HOOP_AGAIN_THROWS = [20, 30]; // once it has gone, it takes this many more throws to come back
  const HOOP_WORDS = ["hoop", "ball"]; // typing one of these summons the hoop
  const HOOP_SECONDS = 20; // length of a basketball round
  const MAX_ROUNDS = 3; // rounds per appearance of a game; after that it's "done" until the game comes back
  const WORD_ROUNDS = 2; // the word game offers "play again" once, then just "done"
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const SCORE_TEXT_SECONDS = 2.2; // how long "+2", "3-pointer" and "no dunks" stay up
  const BEAT_AFTER_THUMPS = 4; // thumps in a row (one bar) before the page picks up the rhythm and keeps drumming
  const BEAT_MAX_GAP = 1.5; // seconds allowed between those thumps; within it, single taps keep thumping
  // the word game: type "words" to bring out the shelf
  const WORD_GAME_SECONDS = 60;
  const WORD_POINTS = [0, 0, 0, 1, 2, 4, 7, 10, 15, 15]; // by word length
  const SHELF_SLOTS = 9;
  const SPELL_MIN = 3; // letters lined up on the floor spelling a word at least this long start the word game
  const SPELL_COOLDOWN = 120; // seconds before an accidental word can start the game again after you close it
  // after this much active play, a little "words?" tab peeks down from the top; click it to start the game
  const PEEK_AFTER = 45, PEEK_STAY = 8, PEEK_AGAIN = 120;
  // every everyday English word (common words, film-subtitle vocabulary, and their real plurals and -ed/-er forms,
  // all checked against the Scrabble dictionary) that can be made from the letters of "alia buckner"
  const WORDS = new Set("ace air ale arc are ark ban bar bin bra bun cab can car cub cue cur ear elk era ice ilk ink ire kin lab lie nab nib nil ran rib rub rue run urn able acne acre akin area aria aura back bail bake bale bane bank bare bark barn beak bean bear beau beck bike bile blue blur bran brie buck bulk bunk burn cake cane care clan club clue crab crib cube curb cure curl earl earn kale kiln lace lack lain lair lake lane lark leak lean liar lice lick lien lieu like line link lira lube luck lure lurk nail narc near neck nice nick nuke race rack rail rain rake rank real rein rice rick rile rink rube ruin rule rune ulna aback alien alike ankle arena baker banal biker black blank blare bleak blink bluer brace brain brake break brick brine brink cabal cabin cable canal clank clean clear clerk clink clunk crane crank creak cruel incur lance learn liner lunar nicer relic renal ulcer uncle urban urine aerial arcane backer banker bicker buckle bunker burial carnal eclair lancer linear nebula neural nickel nuclei racial unable unlike unreal urinal balance blacker blinker bracken buckler caliber calibre clinker clunker cranial luckier nuclear unclear balancer barnacle incurable".split(" "));
  const DROP_FREEZE = 0.4; // seconds of silence, everything frozen, between letting go and the boom
  // in DJ mode the hint bar cycles through what you can do
  const DJ_HINTS = [
    "double-tap high, mid or low to add drums",
    "tap or type letters to play notes",
    "hold a letter still to make it dance",
    "hold empty space for 3 seconds to drop the beat",
  ];
  const DROP_SECTION_BARS = 8; // how long the colourful section after a drop lasts
  const DROP_MIN_HOLD = 3; // the drop only happens if you hold at least this long; letting go sooner calls it off
  const BUILD_SECONDS = 4; // holding during the beat reaches a full build-up after this long
  const DANCE_HOLD = 0.8; // seconds to hold a letter before it starts dancing
  const DANCE_DRIFT = 25; // how far (px) the pointer can wander during that hold
  const DANCE_SECONDS = 30; // how long a letter dances on its own
  const MAX_DANCERS = 10;
  const MAX_EXTRAS = 70; // typed letters, emoji and popped pieces allowed on screen at once
  const CIRCLE_MAX = 5; // most dancers in a circle on a big screen (fewer fit on a phone); any more march around the edge
  const MARCH_PX_PER_BEAT = 55; // how far the marching line moves each beat
  // -------------------------------------------------------------------------

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const stage = document.getElementById("stage");
  const hint = document.getElementById("hint");
  let W = 0, H = 0, DPR = 1;
  const C = {};
  const readColors = () => {
    const s = getComputedStyle(document.documentElement);
    for (const k of ["bg", "fg", "muted", "line", "pink", "sun", "sea", "foam"]) {
      C[k] = s.getPropertyValue("--" + k).trim();
    }
  };
  // Avenir Next on Apple devices (built in); everyone else gets Instrument Sans, loaded from Google Fonts
  const FAMILY = '"Avenir Next", "Instrument Sans", system-ui, sans-serif';
  const WEIGHT = 600; // the name's weight (the dancer's lines are drawn to match it)
  const font = (px) => `${WEIGHT} ${px}px ${FAMILY}`;
  const linkFont = (px) => `400 ${px}px ${FAMILY}`; // the links line is lighter than the name
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const ease = (t) => t * t * (3 - 2 * t);

  // Wraps text and returns one entry per visible letter, centred on (cx, cy).
  const layout = (text, maxW, fs, cx, cy, f = font, lineH = 1.15) => {
    ctx.font = f(fs);
    const lines = [];
    let cur = "";
    let fits = true;
    for (const word of text.split(" ")) {
      if (ctx.measureText(word).width > maxW) fits = false;
      const next = cur ? cur + " " + word : word;
      if (cur && ctx.measureText(next).width > maxW) { lines.push(cur); cur = word; } else cur = next;
    }
    if (cur) lines.push(cur);
    const lh = fs * lineH;
    const height = lines.length * lh;
    const glyphs = [];
    lines.forEach((line, li) => {
      const lw = ctx.measureText(line).width;
      const y = cy - height / 2 + lh * (li + 0.5);
      for (let i = 0; i < line.length; i++) {
        if (line[i] === " ") continue;
        const w = ctx.measureText(line[i]).width;
        glyphs.push({ ch: line[i], x: cx - lw / 2 + ctx.measureText(line.slice(0, i)).width + w / 2, y, w });
      }
    });
    return { glyphs, height, fits, fs, lines: lines.length };
  };
  const fit = (text, maxW, maxH, fs, cx, cy, f = font, lineH = 1.15) => {
    let l = layout(text, maxW, fs, cx, cy, f, lineH);
    while ((l.height > maxH || !l.fits) && fs > 9) { fs *= 0.93; l = layout(text, maxW, fs, cx, cy, f, lineH); }
    // balance the lines so a single word is never left alone on the last one
    let w = maxW;
    while (l.lines > 1 && w > maxW * 0.5) {
      const t = layout(text, w * 0.95, fs, cx, cy, f, lineH);
      if (t.lines !== l.lines || !t.fits) break;
      l = t; w *= 0.95;
    }
    return l;
  };
  // ox/oy shift the glyph so its ink, not its type box, sits on (x, y); the physics bodies are centred on the ink
  const drawGlyph = (ch, x, y, rot, fs, color, ox = 0, oy = 0, f = font) => {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = f(fs);
    ctx.fillStyle = color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(ch, -ox, -oy);
    ctx.restore();
  };

  // the ink box of each character at 100px, measured once: its size and how far its centre sits from the type centre
  const inkCache = new Map();
  const inkOf = (ch, f = font) => {
    const key = (f === font ? "" : "link:") + ch;
    if (!inkCache.has(key)) {
      ctx.save();
      ctx.font = f(100); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const m = ctx.measureText(ch);
      const L = m.actualBoundingBoxLeft || 0, R = m.actualBoundingBoxRight || m.width / 2;
      const A = m.actualBoundingBoxAscent || 35, D = m.actualBoundingBoxDescent || 35;
      ctx.restore();
      inkCache.set(key, { ox: (R - L) / 2, oy: (D - A) / 2, w: L + R, h: A + D });
    }
    return inkCache.get(key);
  };
  const ROUND = new Set(["o", "0", "."]);

  // ---- sound: everything is synthesised, nothing to load; it starts on the first tap or key.
  // Each knock is panned to where it happened and sent through a little room echo.
  const sound = {
    ac: null, out: null, send: null, noise: null, last: 0,
    muted: (() => { try { return localStorage.getItem("bio-toys-muted") === "1"; } catch (e) { return false; } })(),
    unlock() {
      if (!this.ac) {
        try {
          const ac = new (window.AudioContext || window.webkitAudioContext)();
          const comp = ac.createDynamicsCompressor();
          comp.threshold.value = -18; comp.ratio.value = 4;
          comp.connect(ac.destination);
          this.out = ac.createGain(); this.out.gain.value = 0.7; this.out.connect(comp);
          // a short generated room: decaying stereo noise as the reverb impulse
          const len = Math.floor(ac.sampleRate * 1.4), imp = ac.createBuffer(2, len, ac.sampleRate);
          for (let c = 0; c < 2; c++) {
            const d = imp.getChannelData(c);
            for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 3.5);
          }
          const verb = ac.createConvolver(); verb.buffer = imp;
          this.send = ac.createGain(); this.send.gain.value = 0.2;
          this.send.connect(verb).connect(this.out);
          const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = nb.getChannelData(0);
          for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;
          this.noise = nb;
          // a tempo-synced echo for the DJ synth: a delay feeding back into itself, darkened a little each repeat
          this.echo = ac.createDelay(2);
          const fb = ac.createGain(), tone = ac.createBiquadFilter(), wet = ac.createGain();
          fb.gain.value = 0.38; tone.type = "lowpass"; tone.frequency.value = 2200; wet.gain.value = 0.35;
          this.echo.connect(tone); tone.connect(fb); fb.connect(this.echo); tone.connect(wet); wet.connect(this.out);
          this.ac = ac;
        } catch (e) { this.ac = null; }
      }
      if (this.ac && this.ac.state === "suspended") this.ac.resume().catch(() => {});
      // iPhones only let sound start from a finished tap (finger lifted), and want a sound played right then;
      // a silent blip does it, and it keeps trying on each tap until the sound is actually running
      if (this.ac && !this.primed) {
        try {
          const blip = this.ac.createBufferSource();
          blip.buffer = this.ac.createBuffer(1, 1, 22050); blip.connect(this.ac.destination); blip.start(0);
        } catch (e) {}
        if (this.ac.state === "running") this.primed = true;
      }
    },
    ready() { return !this.muted && this.ac && this.ac.state === "running"; },
    // a destination panned left or right by screen position, feeding both the dry mix and the room
    voice(x, dry = false) {
      const ac = this.ac, g = ac.createGain();
      let node = g;
      if (ac.createStereoPanner) {
        const p = ac.createStereoPanner();
        p.pan.value = clamp(((x ?? W / 2) / W) * 2 - 1, -1, 1) * 0.7;
        g.connect(p); node = p;
      }
      node.connect(this.out);
      if (!dry) node.connect(this.send);
      return g;
    },
    osc(dest, type, f0, f1, at, dur, vol, attack = 0.002) {
      if (f0 > 16000) return; // overtones of very high notes would be inaudible anyway
      const ac = this.ac, t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + Math.min(dur, 0.08));
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.03);
    },
    hiss(dest, type, f0, f1, q, at, dur, vol) {
      const ac = this.ac, t = ac.currentTime + at, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = this.noise; src.loopStart = Math.random() * 0.5;
      f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f).connect(g).connect(dest); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
    },
    // one knock: vol 0..1 from how hard it hit, size is the letter's font size (bigger knocks lower), x pans it.
    // opts.step plays a fixed note on a rising scale (the swell boops); opts.pitch shifts the whole knock;
    // the knock is a mechanical-keyboard thock; opts.set "chimes" plays a kalimba note instead (used for the swell)
    hit(vol, size, x, opts = {}) {
      if (!this.ready()) return;
      const set = opts.set || "keyboard";
      const now = this.ac.currentTime, gap = set === "chimes" ? 0.07 : 0.025;
      if (now - this.last < gap) return;
      this.last = now;
      const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
      const stepped = opts.step !== undefined;
      const pm = (opts.pitch || 1) * (stepped ? Math.pow(2, SCALE[clamp(opts.step, 0, SCALE.length - 1)] / 12) : 1);
      const d = this.voice(x), v = 0.06 + 0.94 * vol, sz = clamp(size / 60, 0.3, 2.5);
      switch (set) {
        case "keyboard": {
          const f = clamp(200 / Math.pow(sz, 0.3), 110, 260) * pm;
          this.osc(d, "sine", f, f * 0.65, 0, 0.08, 0.5 * v);
          this.hiss(d, "lowpass", 1900 * Math.sqrt(pm), 800 * Math.sqrt(pm), 0.7, 0, 0.04, 0.4 * v);
          this.hiss(d, "bandpass", 5200, 4800, 0.8, 0, 0.007, 0.18 * v);
          break;
        }
        case "chimes": {
          // a kalimba tine on a pentatonic scale, so any mix of notes sounds pleasant
          const notes = [0, 2, 4, 7, 9], oct = sz > 1.3 ? -1 : sz < 0.6 ? 1 : 0;
          const f = opts.freq || (stepped ? 392 * pm : 392 * Math.pow(2, (notes[Math.floor(Math.random() * 5)] + 12 * oct) / 12) * pm);
          this.osc(d, "sine", f, f, 0, 0.7, 0.24 * v, 0.003);
          this.osc(d, "sine", f * 5.95, f * 5.95, 0, 0.07, 0.05 * v);
          break;
        }
      }
    },
    clang(vol, x) {
      if (!this.ready()) return;
      const d = this.voice(x);
      this.osc(d, "sine", 820, 815, 0, 0.45, 0.12 * vol);

            b.sway = Math.sin(b.chuteT * 1.7 + b.id) * 0.2 + clamp(-b.velocity.x * 0.06, -0.3, 0.3);
            M.Body.setAngle(b, b.sway); M.Body.setAngularVelocity(b, 0);
            M.Body.setVelocity(b, { x: b.velocity.x * 0.97 + Math.cos(b.chuteT * 1.7 + b.id) * 0.12, y: this.zero > 0 ? Math.max(b.velocity.y, 1) : b.velocity.y });
            const landed = b.chuteT > 1 && b.position.y > H * 0.3 && Math.abs(b.velocity.y) < 0.3;
            if (landed || b.chuteT > 9) { b.chute = false; b.frictionAir = 0.012; b.deflate = 0; b.side = Math.random() < 0.5 ? -1 : 1; }
          }
          if (b.deflate !== undefined) {
            b.deflate += dt;
            if (b.deflate > 0.8) b.deflate = undefined;
          }
          if (!b.entering && b.position.y < -b.fs * 0.6) {
            const thrown = b === this.drag || performance.now() - (b.thrownAt || 0) < 2000;
            if (this.flip || this.zero > 0) { M.Body.setPosition(b, { x: b.position.x, y: b.fs }); M.Body.setVelocity(b, { x: b.velocity.x, y: 0 }); continue; }
            if (!thrown) {
              // knocked up there by accident: bounce off the hatch like the rest of the ceiling
              M.Body.setPosition(b, { x: b.position.x, y: b.fs * 0.6 });
              M.Body.setVelocity(b, { x: b.velocity.x, y: Math.abs(b.velocity.y) * 0.35 });
              continue;
            }
            // out through a gap: the harder the throw, the longer it is gone before the parachute brings it back
            if (b === this.drag) this.drag = null;
            b.away = clamp(0.9 + Math.abs(b.velocity.y) * 0.06, 1.1, 2.6);
            b.viaChute = true; // still your throw: if it floats down through the hoop untouched, it scores
            b.awayX = b.position.x;
            b.entering = true; b.collisionFilter.mask = 0;
          }
        }
        if (floatedAway.length) {
          for (const b of floatedAway) M.Composite.remove(this.engine.world, b);
          this.bodies = this.bodies.filter((b) => !floatedAway.includes(b));
        }
        // left alone long enough, the pile puts itself back together
        this.idle += dt;
        this.hoopStep(dt);
        const wait = this.loaded > this.stage ? PILE_FIRST_FIX : PILE_SELF_FIX;
        this.wgStep(dt);
        this.spellWatch(dt);
        this.peekStep(dt);
        this.flyStep(dt);
        this.buildStep(dt);
        this.danceStep(dt);
        if (this.idle > wait && !ptr.down && !this.inGame() && !this.wg) this.gather();
      } else if (this.state === "gather") {
        let far = 0;
        const k = 1 - Math.pow(1 - 0.045, dt * 60);
        for (const b of this.bodies) {
          const a = Math.atan2(Math.sin(b.angle), Math.cos(b.angle));
          M.Body.setPosition(b, { x: b.position.x + (b.hx - b.position.x) * k, y: b.position.y + (b.hy - b.position.y) * k });
          M.Body.setAngle(b, a * (1 - k));
          M.Body.setVelocity(b, { x: 0, y: 0 }); M.Body.setAngularVelocity(b, 0);
          far = Math.max(far, Math.abs(b.hx - b.position.x) + Math.abs(b.hy - b.position.y) + Math.abs(a) * 20);
        }
        if (far < 0.6) {
          for (const b of this.bodies) { M.Body.setPosition(b, { x: b.hx, y: b.hy }); M.Body.setAngle(b, 0); }
          this.state = "set";
        }
      }
    },
    draw() {
      if (!this.ok) { drawGlyph("physics library did not load", W / 2, H / 2, 0, 16, C.muted); return; }
      if (this.quake > 0) {
        const m = this.quake * 14;
        ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
        this.quake = Math.max(0, this.quake - 0.025);
      }
      ctx.globalAlpha = 0.55;
      for (const g of this.ghosts) drawGlyph(g.ch, g.x, g.y, g.r, g.fs, C.fg, g.oxu * g.fs, g.oyu * g.fs);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.lineCap = "round";
      for (const g of this.gaps) {
        for (const x of [g.x0, g.x1]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 7); ctx.stroke(); }
      }
      // a faint ring spreads from every thump, so the beat is visible with the sound off
      for (const r of this.rings) {
        if (r.t < 0) continue;
        ctx.globalAlpha = (1 - r.t / 0.6) * 0.35; ctx.strokeStyle = C.pink; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(r.x, r.y, 16 + r.t * 260 * (r.size || 1), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // while the beat runs, a small step grid on the left shows each row's drum, its 8 steps and the playhead
      if (this.beat) {
        const b = this.beat;
        ctx.save();
        ctx.font = '11px "DM Mono", ui-monospace, Menlo, monospace'; ctx.textBaseline = "middle"; ctx.textAlign = "left";
        [["hat", H / 6], ["snare", H / 2], ["kick", (H * 5) / 6]].forEach(([kind, y]) => {
          const L = b.layers[kind];
          ctx.globalAlpha = L ? 0.9 : 0.4; ctx.fillStyle = C.muted;
          ctx.fillText(kind, 16, y);
          for (let k = 0; k < 8; k++) {
            const x = 64 + k * 11 + (k >= 4 ? 4 : 0), on = L && L.steps.has(k);
            ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2);
            if (on) { ctx.fillStyle = C.pink; ctx.fill(); } else { ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.stroke(); }
            if (k === b.step) { ctx.strokeStyle = C.fg; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2); ctx.stroke(); }
          }
        });
        ctx.restore();
      }
      this.hoopDraw(false);
      for (const b of this.bodies) {
        if (this.state === "loose" && (b.chute || b.deflate !== undefined)) this.drawChute(b);
        if (b.dance) { if (b.dance.held) this.drawDancer(b); continue; }
        if (isStick(b)) { this.drawStick(b, C.pink); continue; }
        // after a drop the letters stay coloured, changing colour on every kick
        const tint = this.dropSec ? [C.pink, C.sun, C.sea][((this.dropColor || 0) + b.id) % 3] : C.fg;
        const glow = this.spelled && this.spelled.bodies.includes(b);
        drawGlyph(b.ch, b.position.x, b.position.y, b.angle, b.fs, b === this.drag || glow ? C.pink : tint, (b.oxu || 0) * b.fs, (b.oyu || 0) * b.fs, b.linkFont);
      }
      this.drawDancers();
      this.peekDraw();
      if (this.spelled) {
        const sp = this.spelled;
        ctx.save();
        ctx.globalAlpha = clamp(2 - sp.t, 0, 1); ctx.fillStyle = C.pink; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
        ctx.font = font(20);
        ctx.fillText("you spelled " + sp.word + "!", clamp(sp.x, 90, W - 90), sp.y - ease(clamp(sp.t / 0.6, 0, 1)) * 14);
        ctx.restore();
      }
      // holding a letter in DJ mode: a ring fills around it, and when it closes the letter starts dancing
      const hl = this.holdLetter;
      if (hl && this.drag === hl && !hl.dance) {
        const prog = (performance.now() - this.holdStart) / (DANCE_HOLD * 1000);
        if (prog > 0.15) {
          const r = Math.max(hl.fs * 0.6, 22);
          ctx.save(); ctx.strokeStyle = C.pink; ctx.lineWidth = 3; ctx.lineCap = "round";
          ctx.beginPath(); ctx.arc(hl.position.x, hl.position.y, r, -Math.PI / 2, -Math.PI / 2 + Math.min(1, prog) * Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
      }
      this.hoopDraw(true);
      this.wgDraw();
      if (this.dropTint > 0) this.dropTint = Math.max(0, this.dropTint - 0.06);
      if (this.freeze) { ctx.globalAlpha = 0.35; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
      // the drop's flash
      if (this.flash > 0) {
        ctx.globalAlpha = this.flash; ctx.fillStyle = C.pink; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
        this.flash = Math.max(0, this.flash - 0.03);
      }
      if (this.drag && this.wg && isStick(this.drag)) this.drawStick(this.drag, C.pink);
      else if (this.drag && this.wg) drawGlyph(this.drag.ch, this.drag.position.x, this.drag.position.y, this.drag.angle, this.drag.fs, C.pink, (this.drag.oxu || 0) * this.drag.fs, (this.drag.oyu || 0) * this.drag.fs);
      // the links line: each letter rises off the top at its own speed, and comes back down the same way
      const ls = this.linkShow ?? 1;
      if (ls > 0) {
        const L = this.linkLayout;
        L.glyphs.forEach((g, i) => {
          const off = (1 - ease(ls)) * (g.y + L.fs * 2) * this.linkSpeed[i];
          drawGlyph(g.ch, g.x, g.y - off, (1 - ls) * this.linkSpin[i], L.fs, C.fg, 0, 0, linkFont);
        });
        if (ls === 1 && this.state === "set") {
          ctx.lineWidth = 3; ctx.lineCap = "round";
          this.links.forEach((k, i) => {
            ctx.strokeStyle = [C.pink, C.sun, C.sea][i % 3];
            ctx.beginPath(); ctx.moveTo(k.x0, k.y + k.fs * 0.52); ctx.lineTo(k.x1, k.y + k.fs * 0.52); ctx.stroke();
          });
          if (!this.poked) {
            ctx.save(); ctx.fillStyle = C.muted; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.font = '13px "DM Mono", ui-monospace, Menlo, monospace';
            ctx.fillText("(go on, give it a poke)", W / 2, Math.max(...L.glyphs.map((g) => g.y)) + L.fs * 1.25);
            ctx.restore();
          }
        }
      }
    },
  };

  // ---- shell --------------------------------------------------------------
  const protos = { pile };
  let cur = null;
  const tabs = [...document.querySelectorAll(".tabs button")];
  const hoopCard = document.getElementById("hoopCard"), hoopScore = document.getElementById("hoopScore");
  const hoopSub = document.getElementById("hoopSub"), hoopBest = document.getElementById("hoopBest");
  const hoopAgain = document.getElementById("hoopAgain"), hoopDone = document.getElementById("hoopDone");
  hoopAgain.addEventListener("click", () => {
    const h = pile.hoop;
    hoopCard.hidden = true;
    if (pile.wg) { pile.wordsAgain(); return; }
    if (h && h.rounds < MAX_ROUNDS) { h.rounds += 1; h.game = "waiting"; h.t = HOOP_SECONDS; h.score = 0; hint.textContent = "the clock starts on your next throw."; }
  });
  hoopDone.addEventListener("click", () => {
    hoopCard.hidden = true;
    if (pile.wg) { pile.wordsQuit(); return; }
    if (pile.hoop) { pile.hoop.game = "done"; pile.hoop.leaving = true; }
    hint.textContent = pile.hint;
  });
  const resetBtn = document.getElementById("resetBtn");
  resetBtn.addEventListener("click", () => { pile.reset(); resetBtn.blur(); });
  const soundBtn = document.getElementById("soundBtn");
  const paintSound = () => { soundBtn.textContent = sound.muted ? "sound off" : "sound on"; soundBtn.setAttribute("aria-pressed", String(sound.muted)); };
  paintSound();
  soundBtn.addEventListener("click", () => {
    sound.muted = !sound.muted;
    try { localStorage.setItem("bio-toys-muted", sound.muted ? "1" : "0"); } catch (e) {}
    if (!sound.muted) sound.unlock();
    paintSound();
    soundBtn.blur();
  });
  const show = (k) => {
    if (!protos[k]) k = "pile";
    hoopCard.hidden = true;
    cur = protos[k];
    cur.init();
    hint.textContent = cur.hint;
    tabs.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  };
  tabs.forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));

  const resize = () => {
    const r = stage.getBoundingClientRect(), oW = W, oH = H;
    const loose = cur && cur.ok && cur.relayout && cur.state !== "set" && oW > 0 && oH > 0;
    // a page squeezed to nothing (a hidden tab or pane) leaves the letters alone until it comes back
    if (loose && (r.width < 120 || r.height < 120)) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(r.width, 50); H = Math.max(r.height, 50);
    const cw = Math.round(W * DPR), ch = Math.round(H * DPR);
    if (cv.width === cw && cv.height === ch && W === oW && H === oH) return;
    cv.width = cw; cv.height = ch; // (this wipes the canvas)
    if (!cur) return;
    // while the letters are loose the room reshapes around them; a standing name just lays itself out again
    if (loose) cur.relayout(oW, oH); else cur.init(true);
    // redraw straight away, so the screen never shows the wiped, empty canvas between frames
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    cur.draw();
  };

  const ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, moved: false, t: 0 };
  let lastTap = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  // a finished tap or click is what an iPhone counts as permission to play sound (touching down isn't)
  window.addEventListener("touchend", () => sound.unlock(), { passive: true });
  window.addEventListener("click", () => sound.unlock());
  const firstGesture = (e) => {
    sound.unlock();
    // iPhones only share tilt after asking, and only from a tap
    if (e && e.pointerType === "touch" && !tilt.asked && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      tilt.asked = true;
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  };
  cv.addEventListener("pointerdown", (e) => {
    firstGesture(e);
    const p = pos(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    Object.assign(ptr, { down: true, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false, t: performance.now() });
    if (cur.down) cur.down(p);
  });
  cv.addEventListener("pointermove", (e) => {
    const p = pos(e), dx = p.x - ptr.x, dy = p.y - ptr.y;
    ptr.x = p.x; ptr.y = p.y;
    if (ptr.down && Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 10) ptr.moved = true;
    if (cur.move) cur.move(p, dx, dy, ptr.down);
  });
  const release = (e) => {
    if (!ptr.down) return;
    ptr.down = false;
    const p = pos(e), now = performance.now();
    if (cur.up) cur.up(p);
    if (ptr.moved || now - ptr.t > 300) return;
    if (lastTap && now - lastTap.t < 340 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 34) {
      lastTap = null;
      // toys without a double-tap action still count every tap
      if (cur.dbl) cur.dbl(p); else if (cur.tap) cur.tap(p);
    } else {
      lastTap = { t: now, x: p.x, y: p.y };
      if (cur.tap) cur.tap(p);
    }
  };
  window.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === "Backspace" || e.key === "Escape") && cur && cur.ctrlKey && cur.wg) {
      if (e.target && e.target.closest && e.target.closest("button")) return;
      e.preventDefault(); cur.ctrlKey(e.key); return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1 || !cur || !cur.key) return;
    firstGesture();
    cur.key(e.key);
  });
  cv.addEventListener("pointerup", release);
  // a long press shouldn't open the browser's own menu (it would cancel holding a letter)
  cv.addEventListener("contextmenu", (e) => e.preventDefault());
  cv.addEventListener("pointercancel", release);

  let prev = 0;
  const frame = (now) => {
    const dt = Math.min((now - prev) / 1000 || 0.016, 0.05);
    prev = now;
    tilt.x += (tilt.target - tilt.x) * Math.min(1, dt * 8);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    cur.step(dt);
    cur.draw();
    requestAnimationFrame(frame);
  };

  const start = () => {
    readColors();
    resize();
    show((location.hash || "").slice(1));
    new ResizeObserver(resize).observe(stage);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
    new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    requestAnimationFrame(frame);
  };
  let started = false;
  const once = () => { if (!started) { started = true; start(); } };
  (document.fonts ? Promise.all([document.fonts.load(font(100)), document.fonts.load(linkFont(100))]).then(() => document.fonts.ready) : Promise.resolve()).then(once, once);
  setTimeout(once, 2500);
})();
</script>
</body>
</html>
